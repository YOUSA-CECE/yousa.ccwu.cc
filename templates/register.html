{% extends "base.html" %}
{% block title %}注册用户 — yousa.dev{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">📝 注册用户</h1>
        <form method="post" class="auth-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="输入用户名" class="form-input">
            </div>
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname"
                       placeholder="显示名称（可选）" class="form-input">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="至少 8 位" class="form-input">
            </div>
            <button type="submit" class="form-btn">创建用户</button>
        </form>
        <p class="auth-hint">密码至少 8 位。注册成功后请使用新账号登录。</p>
        <a href="/login" class="auth-back">← 返回登录</a>
    </div>
</div>
{% endblock %}
